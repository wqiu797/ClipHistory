name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: ./test.sh

      - name: Build Release
        run: |
          xcodebuild \
            -project ClipHistory.xcodeproj \
            -scheme ClipHistory \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/cliphistory-release" \
            -destination 'platform=macOS' \
            build
