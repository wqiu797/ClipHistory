name: ClipHistory
options:
  bundleIdPrefix: com.cliphistory
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  ClipHistory:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClipHistory
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        INFOPLIST_FILE: Sources/ClipHistory/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cliphistory.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

  ClipHistoryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClipHistoryTests
    dependencies:
      - target: ClipHistory
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cliphistory.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

schemes:
  ClipHistory:
    build:
      targets:
        ClipHistory: all
        ClipHistoryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ClipHistoryTests
